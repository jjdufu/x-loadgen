# x-loadgen 通用配置示例（annotated）
# 所有目标/租户/产品/流量均由此文件驱动；工具代码不含业务场景硬编码。

[gateway]
# 网关基址；token 路径为 {base}/auth/token，invoke 为 {base}/api/v1/gateway
base_url = "https://gateway.example:8888"
# 可选 mTLS（PEM 路径，相对本文件或绝对路径）
# client_cert = "certs/client.crt"
# client_key = "certs/client.key"
# ca_cert = "certs/ca.crt"
# insecure_skip_verify = false

# 多进程：>1 时主进程拉起 worker，再汇总报告
[cluster]
processes = 1
# total = 按进程均分 traffic.qps / traffic.requests；per_process = 每进程各自使用完整值
qps_mode = "total"
requests_mode = "total"

[traffic]
# open_loop：按 QPS 投递；closed_loop：尽量打满 concurrency
model = "open_loop"
# 二选一：总请求数 或 持续时间（秒）
requests = 1000
# duration_secs = 60
warmup_secs = 0
ramp_secs = 0
qps = 50
concurrency = 16
timeout_secs = 30
connect_timeout_secs = 5
include_request_id = true
token_refresh_skew_secs = 60

# 可选：将 channel_code 解析为运行时 product_id / path
[resolve]
# product_map = "product-map.toml"
# product-map.toml 示例：
#   [products."FACE_COMPARE"]
#   product_id = "8001"
#   path = "/v1/face/compare"

# 客户列表：每个客户指向独立 secrets，或内联 api_key / 加密字段
[[customers]]
name = "tenant-a"
weight = 1
secrets = "secrets/tenant-a.toml"   # 文件内需有 [tenant]（+ 可选 [tenant.binding]）

# [[customers]]
# name = "tenant-b-inline"
# weight = 1
# api_key = "..."
# encryption_mode = "full"          # none | request | full（及 SDK 支持的 gm 套件组合）
# tenant_id = "..."
# tenant_key_base64 = "..."
# key_version = "v1"
# suite = "suite/tenant-default-2026-11"

[[products]]
name = "demo-echo"
weight = 1
product_id = "1001"                 # 或只写 channel_code，由 [resolve].product_map 填充
# channel_code = "DEMO_ECHO"
path = "/v1/demo/echo"
method = "POST"
# 内联模板；也可用 body_file = "bodies/echo.json"
# 占位符：{{uuid}} {{seq}} {{seq1}} {{iso8601}} {{random_int:MIN:MAX}} {{random_hex:N}}
body_json = """
{"requestId":"{{uuid}}","seq":{{seq}},"ts":"{{iso8601}}"}
"""
expect_transport = "ok"

[report]
enabled = true
dir = "reports"
title = "Gateway Load Test"
lang = "zh"
profile = "standard"

# 可选：压测结束后用 ClickHouse 按 request_id / 时间窗补齐平台侧耗时
[enrichment.clickhouse]
enabled = false
# cli = "clickhouse-client"
# docker_container = "clickhouse"
# user = "default"
# password_env = "CH_PASSWORD"
# sql_file = "enrichment/platform_latency.sql"
# 占位符：{{from_ms}} {{to_ms}} {{request_ids_csv}}
