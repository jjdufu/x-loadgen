<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-loadgen 压测报告 · __ID__</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-muted: #fafafa;
    --border: #e4e4e7;
    --text: #09090b;
    --muted: #71717a;
    --primary: #18181b;
    --primary-fg: #fafafa;
    --emerald: #059669;
    --emerald-bg: rgba(5, 150, 105, 0.08);
    --emerald-border: rgba(5, 150, 105, 0.25);
    --rose: #e11d48;
    --rose-bg: rgba(225, 29, 72, 0.08);
    --rose-border: rgba(225, 29, 72, 0.25);
    --font-sans: "Geist Variable", "Geist", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-mono: "Geist Mono Variable", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --surface: #09090b;
      --surface-muted: #121215;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --primary: #fafafa;
      --primary-fg: #09090b;
      --emerald: #34d399;
      --emerald-bg: rgba(52, 211, 153, 0.1);
      --emerald-border: rgba(52, 211, 153, 0.3);
      --rose: #fb7185;
      --rose-bg: rgba(251, 113, 133, 0.1);
      --rose-border: rgba(251, 113, 133, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--primary); color: var(--primary-fg);
    font-family: var(--font-mono); font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    letter-spacing: -0.03em;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 64px; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-top: 20px;
  }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    background: var(--surface-muted); border: 1px solid var(--border);
  }
  .badge-pass { color: var(--emerald); border-color: var(--emerald-border); background: var(--emerald-bg); }
  .badge-fail { color: var(--rose); border-color: var(--rose-border); background: var(--rose-bg); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    color: var(--muted); font-weight: 500;
    border-bottom: 1px solid var(--border);
    padding: 10px 12px; text-align: left; white-space: nowrap;
  }
  td {
    border-bottom: 1px solid var(--border);
    padding: 10px 12px; text-align: left;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  tbody tr:last-child td { border-bottom: none; }
  .cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  @media (min-width: 640px) {
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (min-width: 1024px) {
    .cards { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  }
  .card {
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    min-width: 0;
  }
  .card span { font-size: 12px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card b {
    display: block; font-size: 18px; font-weight: 600; margin-top: 4px;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    overflow: hidden; text-overflow: ellipsis;
  }
  .chart { width: 100%; height: 290px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark">XL</span>
    <div>
      <h1 id="title">压测报告</h1>
      <div class="muted mono">任务 __ID__ · 状态 <span id="status-text">__STATUS__</span></div>
    </div>
  </div>
  <div id="verdict-badge"></div>
</header>
<main>
  <section>
    <h2>总览指标</h2>
    <div class="cards" id="overview"></div>
    <p class="muted mono" id="range" style="margin: 14px 0 0;"></p>
  </section>
  <section>
    <h2>时序吞吐</h2>
    <div id="timeseries" class="chart"></div>
  </section>
  <section>
    <h2>窗口明细</h2>
    <div id="windows" class="table-wrap"></div>
  </section>
  <section>
    <h2>时间线事件</h2>
    <div id="timeline" class="table-wrap"></div>
  </section>
  <section>
    <h2>中断区间</h2>
    <div id="interrupts" class="table-wrap"></div>
  </section>
</main>
<script>window.__REPORT__ = __PAYLOAD__;</script>
<script>__ECHARTS__</script>
<script>
(function () {
  const r = window.__REPORT__ || {};
  const counters = r.counters || {};
  const pct = r.percentiles || {};
  const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const statusMap = {
    running: "运行中",
    stopping: "停止中",
    finished: "已完成",
    stopped: "已停止",
    interrupted: "已中断",
    failed: "失败"
  };
  const modeMap = { once: "单轮", loop: "循环" };
  const verdictMap = { pass: "通过", fail: "未通过", pending: "评估中" };

  if (r.title) {
    document.getElementById("title").textContent = "压测报告 · " + r.title;
  }
  const statusEl = document.getElementById("status-text");
  if (statusEl && r.status) {
    statusEl.textContent = statusMap[r.status] || r.status;
  }
  const v = r.verdict || {};
  if (v.result && v.result !== "none") {
    const cls = v.result === "pass" ? "badge badge-pass" : (v.result === "fail" ? "badge badge-fail" : "badge");
    const label = verdictMap[v.result] || String(v.result);
    document.getElementById("verdict-badge").innerHTML = '<span class="' + cls + '">SLA: ' + escapeHtml(label) + '</span>';
  }
  const cards = [
    ["总样本", counters.samples],
    ["成功", counters.success],
    ["失败", counters.failure],
    ["预期拒绝", counters.expected],
    ["p50 (µs)", pct.p50_us],
    ["p95 (µs)", pct.p95_us],
    ["p99 (µs)", pct.p99_us],
    ["最大值 (µs)", pct.max_us]
  ];
  document.getElementById("overview").innerHTML = cards.map(([k, val]) =>
    '<div class="card"><span>' + k + '</span><b>' + fmt(val) + '</b></div>').join("");
  const envName = (r.source && r.source.environment_name) ? (" · 环境 " + r.source.environment_name) : "";
  document.getElementById("range").textContent =
    "开始 " + fmtTime(r.started_at) + " · 结束 " + fmtTime(r.ended_at) +
    " · 模式 " + (modeMap[r.mode] || r.mode || "-") + " · 进程数 " + fmt(r.processes) + envName;
  document.getElementById("windows").innerHTML = table(
    ["窗口", "开始时间", "结束时间", "样本", "成功", "失败", "预期", "p99 (µs)", "字节"],
    (r.windows || []).map(w => [w.window_index, fmtTime(w.started_at), fmtTime(w.ended_at), w.samples,
      w.success, w.failure, w.expected, w.p99_us, w.bytes])
  );
  document.getElementById("timeline").innerHTML = table(
    ["时间", "事件", "详情"],
    (r.timeline || []).map(e => [fmtTime(e.ts), e.event, e.payload ? JSON.stringify(e.payload) : ""])
  );
  const ranges = r.interrupt_ranges || [];
  document.getElementById("interrupts").innerHTML = ranges.length
    ? table(["开始时间", "结束时间"], ranges.map(x => [fmtTime(x.start), fmtTime(x.end)]))
    : "<p class='muted'>无中断区间</p>";
  const points = r.timeseries || [];
  const showDot = points.length <= 2;
  const axisColor = isDark ? "#27272a" : "#e4e4e7";
  const labelColor = isDark ? "#a1a1aa" : "#71717a";
  const primaryLine = isDark ? "#fafafa" : "#18181b";
  const okLine = isDark ? "#34d399" : "#059669";
  const errLine = isDark ? "#fb7185" : "#e11d48";
  const chart = echarts.init(document.getElementById("timeseries"));
  chart.setOption({
    backgroundColor: "transparent",
    textStyle: { color: labelColor, fontFamily: "Geist Mono, monospace" },
    grid: { top: 36, right: 20, bottom: 28, left: 48 },
    tooltip: {
      trigger: "axis",
      backgroundColor: isDark ? "#09090b" : "#ffffff",
      borderColor: axisColor,
      textStyle: { color: isDark ? "#fafafa" : "#09090b", fontSize: 12 }
    },
    legend: { data: ["样本", "成功", "失败"], textStyle: { color: labelColor } },
    xAxis: {
      type: "category",
      data: points.map(p => {
        const raw = p.unix_sec || p.started_at;
        if (!raw) return "";
        const ms = raw > 1e11 ? raw : raw * 1000;
        return new Date(ms).toLocaleTimeString("zh-CN", { hour12: false });
      }),
      axisLine: { lineStyle: { color: axisColor } },
      axisLabel: { color: labelColor }
    },
    yAxis: {
      type: "value",
      splitLine: { lineStyle: { color: axisColor, type: "dashed" } },
      axisLabel: { color: labelColor }
    },
    series: [
      { name: "样本", type: "line", smooth: true, showSymbol: showDot, symbolSize: 6, lineStyle: { width: 2 }, itemStyle: { color: primaryLine }, data: points.map(p => p.samples || 0) },
      { name: "成功", type: "line", smooth: true, showSymbol: showDot, symbolSize: 6, lineStyle: { width: 1.75 }, itemStyle: { color: okLine }, data: points.map(p => p.success || 0) },
      { name: "失败", type: "line", smooth: true, showSymbol: showDot, symbolSize: 6, lineStyle: { width: 1.75 }, itemStyle: { color: errLine }, data: points.map(p => p.failure || 0) }
    ]
  });
  window.addEventListener("resize", function () { chart.resize(); });
  function fmt(val) { return (val === null || val === undefined) ? "-" : String(val); }
  function fmtTime(val) {
    if (val === null || val === undefined || val === "") return "-";
    const n = Number(val);
    if (!Number.isFinite(n) || n <= 0) return String(val);
    const ms = n > 1e11 ? n : n * 1000;
    return new Date(ms).toLocaleString("zh-CN", { hour12: false });
  }
  function table(headers, rows) {
    const th = headers.map(h => "<th>" + h + "</th>").join("");
    const tr = rows.map(row => "<tr>" + row.map(c => "<td>" + escapeHtml(fmt(c)) + "</td>").join("") + "</tr>").join("");
    return "<table><thead><tr>" + th + "</tr></thead><tbody>" + tr + "</tbody></table>";
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }
})();
</script>
</body>
</html>
