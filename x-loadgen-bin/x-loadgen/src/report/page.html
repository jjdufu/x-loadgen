<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-loadgen 压测报告 · __ID__</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-muted: #fafafa;
    --border: #e4e4e7;
    --text: #09090b;
    --muted: #71717a;
    --primary: #18181b;
    --primary-fg: #fafafa;
    --emerald: #059669;
    --emerald-bg: rgba(5, 150, 105, 0.08);
    --emerald-border: rgba(5, 150, 105, 0.25);
    --rose: #e11d48;
    --rose-bg: rgba(225, 29, 72, 0.08);
    --rose-border: rgba(225, 29, 72, 0.25);
    --font-sans: "Geist Variable", "Geist", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-mono: "Geist Mono Variable", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --surface: #09090b;
      --surface-muted: #121215;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --primary: #fafafa;
      --primary-fg: #09090b;
      --emerald: #34d399;
      --emerald-bg: rgba(52, 211, 153, 0.1);
      --emerald-border: rgba(52, 211, 153, 0.3);
      --rose: #fb7185;
      --rose-bg: rgba(251, 113, 133, 0.1);
      --rose-border: rgba(251, 113, 133, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--primary); color: var(--primary-fg);
    font-family: var(--font-mono); font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    letter-spacing: -0.03em;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 64px; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-top: 20px;
  }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0 0 16px;
  }
  h3 { font-size: 12px; font-weight: 600; margin: 18px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    background: var(--surface-muted); border: 1px solid var(--border);
  }
  .badge-pass { color: var(--emerald); border-color: var(--emerald-border); background: var(--emerald-bg); }
  .badge-fail { color: var(--rose); border-color: var(--rose-border); background: var(--rose-bg); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    color: var(--muted); font-weight: 500;
    border-bottom: 1px solid var(--border);
    padding: 10px 12px; text-align: left; white-space: nowrap;
  }
  td {
    border-bottom: 1px solid var(--border);
    padding: 10px 12px; text-align: left;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  tbody tr:last-child td { border-bottom: none; }
  .cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  @media (min-width: 640px) {
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (min-width: 1024px) {
    .cards { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  }
  .card {
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    min-width: 0;
  }
  .card span { font-size: 12px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card b {
    display: block; font-size: 18px; font-weight: 600; margin-top: 4px;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    overflow: hidden; text-overflow: ellipsis;
  }
  .chart { width: 100%; height: 290px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark">XL</span>
    <div>
      <h1 id="title">压测报告</h1>
      <div class="muted mono">任务 __ID__ · 状态 <span id="status-text">__STATUS__</span></div>
    </div>
  </div>
  <div id="verdict-badge"></div>
</header>
<main>
  <section>
    <h2>总览指标</h2>
    <div class="cards" id="overview"></div>
    <p class="muted mono" id="range" style="margin: 14px 0 0;"></p>
  </section>
  <section>
    <h2>时序吞吐</h2>
    <div id="timeseries" class="chart"></div>
  </section>
  <section>
    <h2>分项统计</h2>
    <p class="muted" style="margin: 0 0 12px;">按已落库样本计算（不含预热，耗时为原始线上耗时，不做协调遗漏校正）。</p>
    <h3>按接口 / 产品</h3>
    <div id="by-product" class="table-wrap"></div>
    <h3>按租户</h3>
    <div id="by-tenant" class="table-wrap"></div>
    <h3>HTTP 状态码分布</h3>
    <div id="status-codes" class="table-wrap"></div>
    <h3>错误 Top N</h3>
    <div id="top-errors" class="table-wrap"></div>
  </section>
  <section>
    <h2>窗口明细</h2>
    <div id="windows" class="table-wrap"></div>
  </section>
  <section>
    <h2>时间线事件</h2>
    <div id="timeline" class="table-wrap"></div>
  </section>
  <section>
    <h2>中断区间</h2>
    <div id="interrupts" class="table-wrap"></div>
  </section>
</main>
<script>window.__REPORT__ = __PAYLOAD__;</script>
<script>__ECHARTS__</script>
<script>
(function () {
  const r = window.__REPORT__ || {};
  const counters = r.counters || {};
  const pct = r.percentiles || {};
  const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const statusMap = {
    running: "运行中",
    stopping: "停止中",
    finished: "已完成",
    stopped: "已停止",
    interrupted: "已中断",
    failed: "失败"
  };
  const modeMap = { once: "单轮", loop: "循环" };
  const verdictMap = { pass: "通过", fail: "未通过", pending: "评估中" };

  if (r.title) {
    document.getElementById("title").textContent = "压测报告 · " + r.title;
  }
  const statusEl = document.getElementById("status-text");
  if (statusEl && r.status) {
    statusEl.textContent = statusMap[r.status] || r.status;
  }
  const v = r.verdict || {};
  if (v.result && v.result !== "none") {
    const cls = v.result === "pass" ? "badge badge-pass" : (v.result === "fail" ? "badge badge-fail" : "badge");
    const label = verdictMap[v.result] || String(v.result);
    document.getElementById("verdict-badge").innerHTML = '<span class="' + cls + '">SLA: ' + escapeHtml(label) + '</span>';
  }
  const cards = [
    ["样本总数", fmt(counters.samples)],
    ["成功请求", fmt(counters.success)],
    ["失败请求", fmt(counters.failure)],
    ["预期拒绝", fmt(counters.expected)],
    ["p50 延迟", fmtLatencyUs(pct.p50_us)],
    ["p95 延迟", fmtLatencyUs(pct.p95_us)],
    ["p99 延迟", fmtLatencyUs(pct.p99_us)],
    ["累计字节", fmtBytes(counters.bytes)]
  ];
  document.getElementById("overview").innerHTML = cards.map(([k, val]) =>
    '<div class="card"><span>' + k + '</span><b>' + escapeHtml(val) + '</b></div>').join("");
  const envName = (r.source && r.source.environment_name) ? (" · 环境 " + r.source.environment_name) : "";
  const maxTail = (pct.max_us !== null && pct.max_us !== undefined) ? (" · 最大延迟 " + fmtLatencyUs(pct.max_us)) : "";
  document.getElementById("range").textContent =
    "开始 " + fmtTime(r.started_at) + " · 结束 " + fmtTime(r.ended_at) +
    " · 模式 " + (modeMap[r.mode] || r.mode || "-") + " · 进程数 " + fmt(r.processes) + maxTail + envName;
  document.getElementById("windows").innerHTML = (r.windows || []).length
    ? table(
        ["轮次 #", "开始时间", "结束时间", "样本数", "成功", "失败", "预期", "p99 延迟", "字节"],
        (r.windows || []).map(w => ["#" + fmt(w.window_index), fmtTime(w.started_at), fmtTime(w.ended_at), w.samples,
          w.success, w.failure, w.expected, fmtLatencyUs(w.p99_us), fmtBytes(w.bytes)])
      )
    : "<p class='muted'>当前任务无多轮循环窗口记录</p>";
  const bd = r.breakdown || {};
  const groupRows = (list, key) => (list || []).map(g => [
    g[key], g.samples, g.success, g.failure, g.expected,
    fmtLatencyUs(g.p50_us), fmtLatencyUs(g.p95_us), fmtLatencyUs(g.p99_us), fmtLatencyUs(g.max_us)
  ]);
  const groupHead = ["样本", "成功", "失败", "预期拒绝", "P50", "P95", "P99", "最大"];
  document.getElementById("by-product").innerHTML = (bd.products || []).length
    ? table(["接口 / 产品"].concat(groupHead), groupRows(bd.products, "product_id"))
    : "<p class='muted'>暂无样本</p>";
  document.getElementById("by-tenant").innerHTML = (bd.tenants || []).length
    ? table(["租户"].concat(groupHead), groupRows(bd.tenants, "tenant"))
    : "<p class='muted'>暂无样本</p>";
  const codes = Object.entries(bd.status_codes || {});
  document.getElementById("status-codes").innerHTML = codes.length
    ? table(["状态码", "样本数"], codes.map(([code, n]) => [code === "none" ? "无（未到达目标）" : code, n]))
    : "<p class='muted'>暂无样本</p>";
  document.getElementById("top-errors").innerHTML = (bd.top_errors || []).length
    ? table(["错误分类", "错误", "次数", "状态码"], bd.top_errors.map(e => [
        e.error_class, e.error, e.count,
        Object.entries(e.http_status || {}).map(([c, n]) => c + "×" + n).join(" ")
      ]))
    : "<p class='muted'>无失败样本</p>";
  document.getElementById("timeline").innerHTML = (r.timeline || []).length
    ? table(
        ["时间", "事件", "详情"],
        (r.timeline || []).map(e => {
          const t = fmtTimeline(e.event, e.payload);
          return [fmtTime(e.ts), t.label, t.detail];
        })
      )
    : "<p class='muted'>暂无生命周期事件记录</p>";
  const ranges = r.interrupt_ranges || [];
  document.getElementById("interrupts").innerHTML = ranges.length
    ? table(["开始时间", "结束时间"], ranges.map(x => [fmtTime(x.start), fmtTime(x.end)]))
    : "<p class='muted'>无中断区间</p>";
  const points = r.timeseries || [];
  const chartHost = document.getElementById("timeseries");
  if (!points.length) {
    chartHost.style.height = "auto";
    chartHost.innerHTML = "<p class='muted'>暂无秒级吞吐采样数据</p>";
  } else {
    const showDot = points.length <= 2;
    const axisColor = isDark ? "#27272a" : "#e4e4e7";
    const labelColor = isDark ? "#a1a1aa" : "#71717a";
    const primaryLine = isDark ? "#fafafa" : "#18181b";
    const okLine = isDark ? "#34d399" : "#059669";
    const errLine = isDark ? "#fb7185" : "#e11d48";
    const chart = echarts.init(chartHost);
    chart.setOption({
      backgroundColor: "transparent",
      textStyle: { color: labelColor, fontFamily: "Geist Mono, monospace" },
      grid: { top: 36, right: 20, bottom: 28, left: 48 },
      tooltip: {
        trigger: "axis",
        backgroundColor: isDark ? "#09090b" : "#ffffff",
        borderColor: axisColor,
        textStyle: { color: isDark ? "#fafafa" : "#09090b", fontSize: 12 }
      },
      legend: { data: ["总样本/s", "成功/s", "失败/s"], textStyle: { color: labelColor } },
      xAxis: {
        type: "category",
        data: points.map(p => {
          const raw = p.unix_sec || p.started_at;
          if (!raw) return "";
          const ms = raw > 1e11 ? raw : raw * 1000;
          return new Date(ms).toLocaleTimeString("zh-CN", { hour12: false });
        }),
        axisLine: { lineStyle: { color: axisColor } },
        axisLabel: { color: labelColor }
      },
      yAxis: {
        type: "value",
        splitLine: { lineStyle: { color: axisColor, type: "dashed" } },
        axisLabel: { color: labelColor }
      },
      series: [
        { name: "总样本/s", type: "line", smooth: false, showSymbol: showDot, symbolSize: 6, lineStyle: { width: 2, type: "dashed" }, itemStyle: { color: primaryLine }, data: points.map(p => p.samples || 0) },
        { name: "成功/s", type: "line", smooth: false, showSymbol: showDot, symbolSize: 6, lineStyle: { width: 2 }, itemStyle: { color: okLine }, data: points.map(p => p.success || 0) },
        { name: "失败/s", type: "line", smooth: false, showSymbol: showDot, symbolSize: 6, lineStyle: { width: 2 }, itemStyle: { color: errLine }, data: points.map(p => p.failure || 0) }
      ]
    });
    window.addEventListener("resize", function () { chart.resize(); });
  }
  function fmt(val) { return (val === null || val === undefined) ? "-" : String(val); }
  function fmtLatencyUs(us) {
    if (us === null || us === undefined) return "-";
    const n = Number(us);
    if (!Number.isFinite(n)) return String(us);
    if (n < 1000) return n + " µs";
    const ms = n / 1000;
    if (ms < 1000) return ms.toFixed(ms < 10 ? 2 : 1) + " ms";
    return (ms / 1000).toFixed(2) + " s";
  }
  function fmtBytes(bytes) {
    if (bytes === null || bytes === undefined) return "-";
    const n = Number(bytes);
    if (!Number.isFinite(n)) return String(bytes);
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(2) + " MB";
  }
  function fmtTimeline(event, raw) {
    const p = (raw && typeof raw === "object" && !Array.isArray(raw)) ? raw : {};
    switch (event) {
      case "start":
        return { label: "启动压测", detail: p.mode ? ("执行模式：" + (modeMap[p.mode] || p.mode)) : "" };
      case "workers":
        return { label: "拉起工作进程", detail: p.value !== undefined ? ("并发工作进程数：" + p.value) : "" };
      case "worker_exit":
        return { label: "工作进程异常退出", detail: p.value !== undefined ? ("进程编号：w" + p.value) : "" };
      case "traffic": {
        const fq = v => (v === null || v === undefined) ? "不限速" : (v + " QPS");
        return { label: "动态调整流量", detail: "速率 " + fq(p.old_qps) + " → " + fq(p.qps) + "，并发 " + fmt(p.old_concurrency) + " → " + fmt(p.concurrency) };
      }
      case "window": {
        const idx = p.window_index !== undefined ? ("#" + p.window_index) : "-";
        const missed = Number(p.missed_sends || 0);
        return { label: "完成循环窗口", detail: missed > 0 ? ("轮次 " + idx + "（过载漏发 " + missed + " 次）") : ("轮次 " + idx) };
      }
      case "stop": {
        const km = { user: "手动停止", signal: "系统信号" };
        return { label: "收到停止指令", detail: p.kind ? ("触发方式：" + (km[p.kind] || p.kind)) : "" };
      }
      case "resume":
        return { label: "恢复续跑", detail: "" };
      case "interrupted":
        return { label: "任务中断", detail: p.reason === "process restarted" ? "服务进程重启，未完成任务转为中断状态" : (p.reason || "") };
      case "end":
        return { label: "任务结束", detail: "最终状态：" + (statusMap[p.status] || p.status || "-") + (p.error ? (" · 错误：" + p.error) : "") };
      default:
        return { label: String(event || "-"), detail: raw ? JSON.stringify(raw) : "" };
    }
  }
  function fmtTime(val) {
    if (val === null || val === undefined || val === "") return "-";
    const n = Number(val);
    if (!Number.isFinite(n) || n <= 0) return String(val);
    const ms = n > 1e11 ? n : n * 1000;
    return new Date(ms).toLocaleString("zh-CN", { hour12: false });
  }
  function table(headers, rows) {
    const th = headers.map(h => "<th>" + h + "</th>").join("");
    const tr = rows.map(row => "<tr>" + row.map(c => "<td>" + escapeHtml(fmt(c)) + "</td>").join("") + "</tr>").join("");
    return "<table><thead><tr>" + th + "</tr></thead><tbody>" + tr + "</tbody></table>";
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }
})();
</script>
</body>
</html>
