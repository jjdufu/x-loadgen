<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b' stroke='%2327272a' stroke-width='1.5'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='ui-monospace,monospace' font-weight='700' font-size='13.5' letter-spacing='-0.5' fill='%23fafafa'%3EXL%3C/text%3E%3C/svg%3E"
    />
    <title>x-loadgen — API Debugging &amp; Load Testing</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("x-loadgen.theme.v3");
          var isBlack =
            saved === "black" ||
            (saved !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (isBlack) {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          } else {
            root.classList.remove("dark");
            root.style.colorScheme = "light";
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
