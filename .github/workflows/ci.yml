name: CI

# 每次 push 到 main 与每个 PR 的质量门：前端 lint/typecheck/build，Rust fmt/clippy/test，
# 脚本与工作流静态检查。main 上 CI 通过后由 release.yml（workflow_run）决定是否发版。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NODE_VERSION: '20.19.2'
  PNPM_VERSION: '10.34.6'
  ACTIONLINT_VERSION: '1.7.12'
  WEB_DIR: x-loadgen-bin/x-loadgen/web

jobs:
  scripts:
    name: Scripts and workflows lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version | head -2
          git ls-files '*.sh' | xargs shellcheck

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Release script self-test
        run: |
          set -euo pipefail
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          .github/scripts/release-test.sh

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.WEB_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.WEB_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # build.rs 把 web/dist 嵌进二进制；Rust 任务用这份真实产物编译，不跳过嵌入。
      - name: Upload dist for embed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: ${{ env.WEB_DIR }}/dist
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust fmt, clippy -D warnings, test
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ env.WEB_DIR }}/dist

      # 工具链与组件只看 rust-toolchain.toml（channel + clippy/rustfmt）。
      - name: Install Rust from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc -vV
          cargo clippy -V
          cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PR 缓存只在 refs/pull/N/merge 可见、不会复用；只在 main 保存
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (strict)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
