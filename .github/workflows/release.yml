name: Release

# main 上的 CI 成功后自动运行，按约定式提交决定是否发版（规则见 .github/scripts/release.sh 与 README）：
#   version   计算版本 → 改写版本文件与 CHANGELOG → 提交 chore(release) → 打 vX.Y.Z tag → 推回 main
#   image     amd64 / arm64 原生 runner 各自 docker buildx build 仓库根 Dockerfile，按 digest 推送
#   manifest  合并为多架构镜像 dex2all/x-loadgen:X.Y.Z 与 :latest
#   publish   创建 GitHub Release（CHANGELOG 段落 + docker pull）
# GITHUB_TOKEN 推送的提交和 tag 不会再触发任何 workflow，所以构建镜像放在本 workflow 内；
# release 提交另带 [skip ci]，且 release.sh 不把 chore(release) 计入下一次发版。
# 某个任务失败后用 “Re-run failed jobs” 重跑即可，已成功的 version 任务及其输出会被复用。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: dex2all/x-loadgen

jobs:
  version:
    name: Plan version, commit and tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Notes file outside the work tree
        run: echo "NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Checkout (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # CI 跑完时 main 若已前进，交给新提交对应的那次运行，避免对旧提交发版或推送冲突。
      - name: Require main to still point at the CI commit
        id: head
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$main_sha" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved to ${main_sha}; skip release for ${SHA}"
          fi

      - name: Plan
        id: plan
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          .github/scripts/release.sh plan
          if [ -s "$NOTES_FILE" ]; then cat "$NOTES_FILE"; fi

      - name: Commit, tag and push
        if: steps.plan.outputs.release == 'true'
        env:
          V: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .github/scripts/release.sh apply "$V"
          git add -A
          git commit -m "chore(release): v${V} [skip ci]"
          git tag -a "v${V}" -F "$NOTES_FILE"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${V}"
          {
            echo "### Release v${V}"
            echo
            cat "$NOTES_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  image:
    name: image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        env:
          V: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/build-meta.json"
          ok=""
          for i in 1 2 3; do
            if docker buildx build \
                --platform "linux/${ARCH}" \
                --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
                --label org.opencontainers.image.version="$V" \
                --provenance=false --sbom=false \
                --metadata-file "$meta" \
                --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
                .; then
              ok=1
              break
            fi
            echo "::warning::build/push attempt $i failed, retrying in $((i * 20))s"
            sleep $((i * 20))
          done
          [ -n "$ok" ] || exit 1
          digest="$(jq -r '."containerimage.digest"' "$meta")"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest in build metadata"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          echo "${IMAGE}@${digest} (linux/${ARCH})" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 3

  manifest:
    name: Multi-arch manifest
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create ${{ env.IMAGE }}:${{ needs.version.outputs.version }} and latest
        working-directory: ${{ runner.temp }}/digests
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 digests, got ${#refs[@]}"; exit 1; }
          docker buildx imagetools create --tag "${IMAGE}:${V}" --tag "${IMAGE}:latest" "${refs[@]}"

      - name: Verify pushed manifest
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for ref in "${IMAGE}:${V}" "${IMAGE}:latest"; do
            raw="$(docker buildx imagetools inspect --raw "$ref")"
            echo "$ref -> $(jq -r .mediaType <<<"$raw") [$(jq -r '[.manifests[].platform.architecture]|join(",")' <<<"$raw")]"
            jq -e '[.manifests[].platform.architecture] | index("amd64") and index("arm64")' <<<"$raw" >/dev/null
          done

  publish:
    name: GitHub Release
    needs: [version, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
          NOTES_DIR: ${{ runner.temp }}/notes
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-body.md"
          {
            cat "$NOTES_DIR/release-notes.md"
            echo
            echo "### 镜像（linux/amd64 + linux/arm64）"
            echo
            echo '```shell'
            echo "docker pull ${IMAGE}:${V}"
            echo '```'
          } > "$body"
          if gh release view "v${V}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v${V}" -R "$GITHUB_REPOSITORY" --title "v${V}" --notes-file "$body"
          else
            gh release create "v${V}" -R "$GITHUB_REPOSITORY" --verify-tag --title "v${V}" --notes-file "$body"
          fi
