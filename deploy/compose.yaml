services:
  x-loadgen:
    image: x-loadgen:${X_LOADGEN_VERSION:-0.1.0}
    user: "10001:10001"
    environment:
      TZ: Asia/Shanghai
      X_LOADGEN_LISTEN: "0.0.0.0:8757"
      X_LOADGEN_DATA_DIR: /data
      X_LOADGEN_NO_AUTH: ${X_LOADGEN_NO_AUTH:-0}
      X_LOADGEN_MAX_QPS: ${X_LOADGEN_MAX_QPS:-}
      X_LOADGEN_MAX_CONCURRENCY: ${X_LOADGEN_MAX_CONCURRENCY:-}
    volumes:
      - ./data:/data
    ports:
      - "${X_LOADGEN_HOST_BIND:-}8757:8757"
    healthcheck:
      test: ["CMD", "x-loadgen", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    stop_signal: SIGTERM
